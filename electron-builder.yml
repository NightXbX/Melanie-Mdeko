appId: com.mdeko.app
productName: Mdeko
copyright: m·deko
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
npmRebuild: false
asar: true
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.productivity
  minimumSystemVersion: '14.0'
  # Signature ad hoc : pas de compte Apple Developer pendant le test.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    CFBundleDevelopmentRegion: fr
    LSHasLocalizedDisplayName: false
dmg:
  title: Mdeko
# Version Windows : pour que le développeur teste l'appli sur son PC (non signée, comme sur Mac).
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Mdeko
  artifactName: ${productName}-${version}-windows-installation.${ext}
publish: null
