name: Build Mac et Windows

# Mac (Apple Silicon) : l'appli de Mélanie. Windows : pour tester sur le PC du développeur.
# Chaque push sur main publie une Release numérotée 0.1.<numéro du passage> (version de package.json
# pour les deux premiers nombres) : les applis installées la proposent d'elles-mêmes (mise à jour intégrée).
# Un tag vX.Y.Z publie aussi une Release, avec ce numéro-là.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Lecture seule par défaut ; seule la publication écrit dans le dépôt.
permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Signature ad hoc aussi pour les pull requests (aucun certificat ni secret en jeu).
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Numéro de version (publication)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: npm version "$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" --no-git-tag-version

      - name: Vérifications
        run: |
          npm run typecheck
          npm test

      - name: Construction de l'appli
        run: npm run dist:mac

      - name: Contrôle de la signature
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Mdeko.app
          codesign -dv release/mac-arm64/Mdeko.app

      - name: Contrôle du contenu (lecteur PDF embarqué)
        run: |
          node -e "const l = require('@electron/asar').listPackage('release/mac-arm64/Mdeko.app/Contents/Resources/app.asar'); if (!l.some((f) => f.endsWith('mupdf-wasm.wasm'))) { console.error('mupdf absent du paquet'); process.exit(1) } console.log('mupdf embarqué')"

      - uses: actions/upload-artifact@v4
        with:
          name: Mdeko-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 14

  windows:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Numéro de version (publication)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: npm version "$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" --no-git-tag-version

      - name: Construction de l'appli
        run: npm run dist:win

      - name: Contrôle du contenu (lecteur PDF embarqué)
        run: |
          node -e "const l = require('@electron/asar').listPackage('release/win-unpacked/resources/app.asar'); if (!l.some((f) => f.endsWith('mupdf-wasm.wasm'))) { console.error('mupdf absent du paquet'); process.exit(1) } console.log('mupdf embarqué')"

      - uses: actions/upload-artifact@v4
        with:
          name: Mdeko-windows
          path: release/*.exe
          retention-days: 14

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").$GITHUB_RUN_NUMBER"
          fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
