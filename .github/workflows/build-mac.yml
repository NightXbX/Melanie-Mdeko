name: Build Mac

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vérifications
        run: |
          npm run typecheck
          npm test

      - name: Construction de l'appli
        run: npm run dist:mac

      - name: Contrôle de la signature
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Mdeko.app
          codesign -dv release/mac-arm64/Mdeko.app

      - uses: actions/upload-artifact@v4
        with:
          name: Mdeko-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 14

      - name: Publication (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip --title "$GITHUB_REF_NAME" --generate-notes
