name: Build Mac et Windows

# Mac (Apple Silicon) : l'appli de Mélanie. Windows : pour tester sur le PC du développeur.
# Un tag vX.Y.Z publie les deux installateurs dans une Release GitHub.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vérifications
        run: |
          npm run typecheck
          npm test

      - name: Construction de l'appli
        run: npm run dist:mac

      - name: Contrôle de la signature
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Mdeko.app
          codesign -dv release/mac-arm64/Mdeko.app

      - name: Contrôle du contenu (lecteur PDF embarqué)
        run: |
          node -e "const l = require('@electron/asar').listPackage('release/mac-arm64/Mdeko.app/Contents/Resources/app.asar'); if (!l.some((f) => f.endsWith('mupdf-wasm.wasm'))) { console.error('mupdf absent du paquet'); process.exit(1) } console.log('mupdf embarqué')"

      - uses: actions/upload-artifact@v4
        with:
          name: Mdeko-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 14

  windows:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Construction de l'appli
        run: npm run dist:win

      - name: Contrôle du contenu (lecteur PDF embarqué)
        run: |
          node -e "const l = require('@electron/asar').listPackage('release/win-unpacked/resources/app.asar'); if (!l.some((f) => f.endsWith('mupdf-wasm.wasm'))) { console.error('mupdf absent du paquet'); process.exit(1) } console.log('mupdf embarqué')"

      - uses: actions/upload-artifact@v4
        with:
          name: Mdeko-windows
          path: release/*.exe
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
